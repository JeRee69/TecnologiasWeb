services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ediconnect_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - ediconnect_network
    depends_on:
      - db

  web:
    image: nginx:1.24-alpine
    container_name: ediconnect_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ediconnect_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ediconnect_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ediconnect_db}
      MYSQL_USER: ${DB_USERNAME:-ediconnect_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - ediconnect_db_data:/var/lib/mysql
    networks:
      - ediconnect_network

networks:
  ediconnect_network:
    driver: bridge

volumes:
  ediconnect_db_data:
    driver: local
