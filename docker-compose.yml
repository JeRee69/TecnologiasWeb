services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: EdiConnect
      APP_ENV: local
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ediconnect_db}
      DB_USERNAME: ${DB_USERNAME:-ediconnect_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ediconnect_storage:/var/www/html/storage
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
    networks:
      - ediconnect_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  web:
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ediconnect_network
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ediconnect_db}
      MYSQL_USER: ${DB_USERNAME:-ediconnect_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - ediconnect_db_data:/var/lib/mysql
    networks:
      - ediconnect_network
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  ediconnect_network:
    driver: bridge

volumes:
  ediconnect_db_data:
    driver: local
  ediconnect_storage:
    driver: local
